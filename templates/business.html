{% extends "base.html" %}
{% block title %}Business{% endblock %}
{% block content %}
<h1>Business</h1>

<div id="setup">
  <p>Enter 2 to 6 player names (comma separated):</p>
  <input id="names" value="Player 1, Player 2" size="40">
  <button id="start">Start game</button>
</div>

<div id="game" class="game-area" hidden>
  <div id="mono" class="mono"></div>
  <div class="players" id="players"></div>
</div>
<div id="status" class="status"></div>
{% endblock %}

{% block scripts %}
<script>
const COLORS = { brown:"#8b5a2b", lightblue:"#7fd1f0", pink:"#e86fb0", orange:"#f39c3d",
                 red:"#e23b3b", yellow:"#f4d03f", green:"#2fa65a", blue:"#2c5fd6" };
const TOKEN_COLORS = ["#e23b3b", "#2c5fd6", "#2fa65a", "#f4d03f", "#e86fb0", "#f39c3d"];

let BOARD = [];
let state = null;

const statusEl = document.getElementById("status");
function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (isError ? " error" : "");
}

// square index (0-39) -> [row, col] on an 11x11 grid, going round the edge
function gridPos(i) {
  if (i <= 10) return [10, 10 - i];
  if (i <= 20) return [10 - (i - 10), 0];
  if (i <= 30) return [0, i - 20];
  return [i - 30, 10];
}

async function api(url, method = "GET", body) {
  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function act(name) {
  try { state = await api("/api/business/" + name, "POST"); setStatus(""); }
  catch (e) { setStatus(e.message, true); }
  render();
}

function render() {
  const mono = document.getElementById("mono");
  mono.innerHTML = "";

  BOARD.forEach((sq, i) => {
    const [r, c] = gridPos(i);
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.gridRow = r + 1;
    cell.style.gridColumn = c + 1;

    if (sq.color) {
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.background = COLORS[sq.color];
      cell.appendChild(bar);
    }
    const name = document.createElement("div");
    name.textContent = sq.name + (sq.price ? " (" + sq.price + ")" : "");
    cell.appendChild(name);

    const owner = state.owners[String(i)];
    if (owner !== undefined) {
      const o = document.createElement("div");
      o.className = "own";
      o.style.color = TOKEN_COLORS[owner];
      o.textContent = "●";
      cell.appendChild(o);
    }

    const tokens = document.createElement("div");
    tokens.className = "tokens";
    state.players.forEach((p, idx) => {
      if (p.position === i && !p.bankrupt) {
        const t = document.createElement("div");
        t.className = "tok";
        t.style.background = TOKEN_COLORS[idx];
        t.title = p.name;
        tokens.appendChild(t);
      }
    });
    cell.appendChild(tokens);
    mono.appendChild(cell);
  });

  // centre panel: whose turn, dice, buttons, log
  const center = document.createElement("div");
  center.className = "center";
  const phase = state.phase;
  const cur = state.players[state.current];
  const roll = state.last_roll ? `Rolled ${state.last_roll[0]} + ${state.last_roll[1]}` : "";
  center.innerHTML = phase === "over"
    ? `<h2>${state.winner} wins!</h2>`
    : `<h3>${state.current_name}'s turn</h3><div>${roll}</div>`;

  const actions = document.createElement("div");
  actions.className = "actions";
  const addBtn = (label, name, enabled, secondary = false) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.disabled = !enabled;
    if (secondary) b.className = "secondary";
    b.onclick = () => act(name);
    actions.appendChild(b);
  };
  addBtn("Roll dice", "roll", phase === "roll");
  addBtn("Buy", "buy", phase === "buy");
  addBtn("Skip", "skip", phase === "buy", true);
  addBtn("End turn", "end_turn", phase === "end_turn");
  if (phase === "roll" && cur.in_jail) addBtn("Pay 50 to leave jail", "pay_fine", true, true);
  center.appendChild(actions);

  const log = document.createElement("div");
  log.className = "log";
  log.innerHTML = state.log.slice().reverse().map(l => `<div>${l}</div>`).join("");
  center.appendChild(log);
  mono.appendChild(center);

  // players sidebar
  const side = document.getElementById("players");
  side.innerHTML = "";
  state.players.forEach((p, idx) => {
    const d = document.createElement("div");
    d.className = "player" + (idx === state.current ? " current" : "") + (p.bankrupt ? " bankrupt" : "");
    d.style.borderLeftColor = TOKEN_COLORS[idx];
    const props = p.properties.map(i => BOARD[i].name).join(", ") || "none";
    d.innerHTML = `<b>${p.name}</b>${p.in_jail ? " (in jail)" : ""}<br>Cash: ${p.cash}<br><small>Owns: ${props}</small>`;
    side.appendChild(d);
  });
}

function showGame() {
  document.getElementById("setup").hidden = true;
  document.getElementById("game").hidden = false;
  render();
}

document.getElementById("start").onclick = async () => {
  const names = document.getElementById("names").value.split(",").map(s => s.trim()).filter(Boolean);
  try {
    BOARD = await api("/api/business/board");
    state = await api("/api/business/new", "POST", { players: names });
    setStatus("");
    showGame();
  } catch (e) { setStatus(e.message, true); }
};

// if a game is already running on the server (e.g. page refresh), pick it up
(async () => {
  try {
    BOARD = await api("/api/business/board");
    state = await api("/api/business/state");
    showGame();
  } catch (e) { /* no game yet: show the setup form */ }
})();
</script>
{% endblock %}
